name: ci-cd

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pasar los tests
        run: pytest -v

  desplegar:
    # Solo con un push a main, si los tests han pasado y si la variable DESPLEGAR del repositorio vale true
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DESPLEGAR == 'true'
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validar el bundle
        run: databricks bundle validate -t dev
      - name: Desplegar en Databricks
        run: databricks bundle deploy -t dev
